spring.application.name=hibernate-in-action

spring.datasource.url=jdbc:mysql://127.0.0.1:3307/hibernatedb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=12345

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 1. Önbellekleri aktif ediyoruz
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.redisson.hibernate.RedissonRegionFactory
spring.jpa.properties.hibernate.cache.redisson.config=redisson.yaml
spring.jpa.properties.hibernate.cache.redisson.fallback=true



#batch20-50 arasi idealdir
spring.jpa.properties.hibernate.jdbc.batch_size=5
#spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

spring.jpa.properties.hibernate.generate_statistics=true





spring.datasource.hikari.connection-timeout=4000


management.endpoints.web.exposure.include=health,info,prometheus,metrics
#bu endpointleri de almasini soyledik